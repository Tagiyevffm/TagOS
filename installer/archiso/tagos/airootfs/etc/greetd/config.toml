# Live media: greetd starts the TagOS session directly.
#
# greetd requires a [default_session] block even when [initial_session] is set -
# without it the daemon exits immediately with "no default_session specified",
# which is what kept the live image on a text login. tuigreet is the fallback if
# the automatic session ever fails to start.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --cmd /usr/bin/tag-session"
user = "greeter"

[initial_session]
# tee keeps the session log where the diagnostic unit can read it: greetd swallows
# the child's stderr, which is why a failing session left no trace on the console.
command = "/bin/sh -c '/usr/bin/tag-session 2>&1 | tee /tmp/tagos-session.log' cli
user = "tagos"
