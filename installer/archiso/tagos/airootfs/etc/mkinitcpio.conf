# Live media initramfs.
#
# The `archiso` hook is what finds and mounts the squashfs image on the medium and
# sets up the writable overlay; without it mkinitcpio reports "failed to detect
# root filesystem" and the ISO stops in the recovery shell with an empty root=.
# Hook order matters: block -> archiso -> filesystems -> fsck.
# `autodetect` runs inside a chroot where there is nothing to detect, so the
# medium drivers must be explicit: without the CD-ROM/SCSI stack the archiso hook
# boots, then reports "Device '<uuid>' not found" because it cannot see the ISO.
MODULES=(virtio_gpu virtio_blk virtio_net virtio_pci ahci sr_mod cdrom sd_mod usb-storage uas)
BINARIES=()
FILES=()
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block archiso filesystems fsck)
COMPRESSION="xz"
