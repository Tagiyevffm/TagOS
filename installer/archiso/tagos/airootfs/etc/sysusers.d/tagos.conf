# Live session user.
#
# systemd-sysusers creates the account at boot (before greetd), so the image does
# not ship a hand-written /etc/passwd. /home/tagos is created by the tmpfiles
# entry below.
u  tagos - "TagOS Live User" /home/tagos /bin/bash
m  tagos wheel
m  tagos audio
m  tagos video
m  tagos input
m  tagos render
m  tagos seat
m  tagos rfkill
m  tagos network
