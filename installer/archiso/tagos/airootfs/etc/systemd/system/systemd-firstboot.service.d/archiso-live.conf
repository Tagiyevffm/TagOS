# The live medium must never drop into the interactive first-boot prompt.
#
# systemd-firstboot runs on the serial console and asks for the timezone before
# anything else; on the TagOS ISO that blocked greetd, the desktop session and the
# boot marker (the serial log stopped at "Please configure the system!"). The
# image ships a fixed locale and UTC, so the unit is skipped entirely.
[Unit]
ConditionPathExists=!/etc/archiso-live
