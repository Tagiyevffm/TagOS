title    TagOS Live (x86_64, UEFI)
linux    /arch/boot/x86_64/vmlinuz-linux
initrd   /arch/boot/x86_64/initramfs-linux.img
# console=ttyS0 keeps the serial console for tools/run-qemu.sh --boot-test and CI.
options  archisosearchuuid=%ARCHISO_UUID% cow_spacesize=3G copytoram=n console=tty0 console=ttyS0,115200
